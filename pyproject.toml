[project]
name = "floodit-churn"
version = "1.0.0"
description = "Flood-It churn model (XGBoost) — batch scoring package"
readme = "README.md"
requires-python = ">=3.9,<3.14"
dependencies = [
    "catboost>=1.2.10",
    "google-cloud-bigquery>=3.41.0",
    "ipywidgets>=8.1.8",
    "lightgbm>=4.6.0",
    "matplotlib>=3.9.4",
    "mlserver>=1.7.1",
    "notebook>=7.5.7",
    "numpy>=2.0.2",
    "optuna>=4.9.0",
    "pandas>=2.3.3",
    "pandas-profiling[notebook]>=3.6.6",
    "pyarrow>=21.0.0",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "shap>=0.49.1",
    "widgetsnbextension>=4.0.15",
    "xgboost>=2.1.4",
]

[project.scripts]
floodit-train = "floodit_churn.cli:train_cmd"
floodit-score = "floodit_churn.cli:score_cmd"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floodit_churn"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
